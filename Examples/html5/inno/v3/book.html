<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>INNOVATE THE FUTURE, InnovationsoftheWorld.com</title>
    <script type='text/javascript' src='https://www.x3dom.org/download/dev/x3dom.debug.js'> </script>
    <link rel='stylesheet' type='text/css' href='https://www.x3dom.org/download/x3dom.css'/>
    <style>
        html, body {
            margin: 0px;
            padding: 0px;
            border: 0px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(rgb(128 128 128 / 50%), rgb(255 255 255 / 49%));
        }

        X3D {
            width: 100%;
            height: 100%;
        }

        .buttons {
          position: fixed;
          top: 90%;
          right: 50%;
        }

        .heading {
          position: fixed;
          right: 50%;
          opacity: 10%;
          font-family: sans-serif;
        }
    </style>
</head>
<script>

  function openBook() {
    const ts=document.querySelector('Inline').querySelector('[DEF=TIMEOpen]');
    ts.setAttribute('loop', false);
    ts.setAttribute('startTime', Date.now()/1000);
  }

  function closeBook() {
    const ts=document.querySelector('Inline').querySelector('[DEF=TIMEClose]');
    ts.setAttribute('loop', false);
    ts.setAttribute('startTime', Date.now()/1000);
  }
  function flipRight() {
    const ts=document.querySelector('Inline').querySelector('[DEF=TIMEFlipRight]');
    ts.setAttribute('loop', false);
    ts.setAttribute('startTime', Date.now()/1000);
  }
  function flipLeft() {
    const ts=document.querySelector('Inline').querySelector('[DEF=TIMEFlipLeft]');
    ts.setAttribute('loop', false);
    ts.setAttribute('startTime', Date.now()/1000);
  }

</script>
<body>
<X3D _disableKeys='true'>
  <!--h1 class='heading'>INNOVATE</h1-->
  <div class='buttons'>
      <button onclick='openBook()'>Open</button>
      <button onclick='closeBook()'>Close</button>
	  <button onclick='flipRight()'>Page Forwards</button>
	  <button onclick='flipLeft()'>Page Backwards</button>
  </div>

  <Scene>
    <Viewpoint position="-111.58013 47.22145 -6.75127" orientation="-0.25460 0.79463 0.55112 3.53830" 
	  zNear="0.1000" zFar="100.00000" centerOfRotation="-79.33846 4.46750 13.24657" fieldOfView="0.78540" description="look down"></Viewpoint>
    <Inline url='"Book Flip - UVW for 1 Texture.x3d"' namespacename='book'></Inline>
  </Scene>
</X3D>
</body>
</html>
