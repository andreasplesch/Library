<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>BOOK THE FUTURE, InnovationsoftheWorld.com</title>
    <script type='text/javascript' src='https://www.x3dom.org/download/dev/x3dom.debug.js'> </script>
    <link rel='stylesheet' type='text/css' href='https://www.x3dom.org/download/x3dom.css'/>
    <style>
        html, body {
            margin: 0px;
            padding: 0px;
            border: 0px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(rgb(128 128 128 / 50%), rgb(255 255 255 / 49%));
        }

        X3D {
            width: 100%;
            height: 100%;
        }

        .buttons {
          position: fixed;
          top: 90%;
          right: 50%;
        }

        .heading {
          position: fixed;
          right: 50%;
          opacity: 10%;
          font-family: sans-serif;
        }
    </style>
</head>
<script>

  const bookTexture = '"xmas_carol_4k.jpg"';

  function openbook() {
    const ts=document.querySelector('Inline').querySelector('[DEF=TIMEOpen]');
    ts.setAttribute('loop', false);
    ts.setAttribute('startTime', Date.now()/1000);
  }

  function closebook() {
    const ts=document.querySelector('Inline').querySelector('[DEF=TIMEClose]');
    ts.setAttribute('loop', false);
    ts.setAttribute('startTime', Date.now()/1000);
  }
  
  function customizeBook(event) {
	const imageTexture = event.target.querySelector('ImageTexture');
	imageTexture.setAttribute('url', bookTexture);
	console.log(imageTexture);
  }
  
  function init() {
  const x_0 = 2543 - 1254;
  const y_0 = 3936 - 2339;
  const x = 1477;
  const y = 2245;
  const x_scale = x/x_0;
  const y_scale = y/y_0;
  document.querySelector("#scaler").setAttribute("scale",`${x_scale} 1 ${y_scale}`);
  }

</script>
<body onload = 'init()'>
<X3D disableKeys='false'>
  <!--h1 class='heading'>INNOVATE</h1-->
  <div class='buttons'>
      <button onclick='openbook()'>Open</button>
      <button onclick='closebook()'>Close</button>
  </div>

  <Scene>
    <Viewpoint position="-0.55764 0.49354 -0.08558" orientation="0.00540 0.87545 0.48329 3.11444" 
	zNear="0.01000" zFar="100.00000" centerOfRotation="-0.57302 0.04493 0.19688" fieldOfView="0.78540" description="look down"></Viewpoint>
    <Transform id="scaler" scale='1 1 1'>
      <Inline onload='customizeBook(event)' url='"Chrismas Carol - One Texture Low Poly EdgeSplit.x3d"' namespacename='book'></Inline>
    </Transform>
  </Scene>
</X3D>
</body>
</html>
