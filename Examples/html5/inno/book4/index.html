X3D, x3d {
	position:relative;
	cursor:pointer;
	margin: 0;
	padding: 0;
	outline: none;
	display: block;
}

X3D:hover, 
x3d:hover, 
.x3dom-canvas:hover {
	-webkit-user-select: none;
	-webkit-touch-callout: none;
}

.x3dom-canvas {
	border:none;
	cursor:pointer;
	cursor:-webkit-grab;
	cursor:grab;
	width:100%;
	height:100%;
}

.x3dom-canvas-mousedown {
  cursor:-webkit-grabbing;
  cursor:grabbing;
}

.x3dom-canvas:focus {
	outline:none; 
}

.x3dom-progress {
	left: 16px;
	top: 16px;
	position: absolute;
	color: #646464;
	font-family: Helvetica, sans-serif;
	font-size: 14px;
	font-weight: bold;
	z-index: 100;
	display: flex;
	justify-content: center;
	align-items: center;
	background: rgba(255, 255, 255, 0.1);
	padding: 12px;
	border-radius: 5px;
	pointer-events: none;
	transition: opacity 0.2s ease-in-out;
}

.x3dom-progress-spinner {
	border: 2px solid #f3f3f3; /* Light grey */
	border-top: 2px solid #646464; /* Blue */
	border-radius: 50%;
	width: 16px;
	height: 16px;
	animation: spin 1s linear infinite;
	margin-right: 12px;
}

@keyframes spin {
	0% { transform: rotate(0deg); }
	100% { transform: rotate(360deg); }
}

#x3dom-state-viewer {
	position: absolute;
	margin: 2px;
	padding: 5px;
	width: 135px;
	top: 0%;
	right: 0%;
	opacity: 0.9;
	background-color: #323232;
	z-index: 1000;
	font-family: Arial, sans-serif;
	color: #C8C8C8;
	font-weight: bold;
	text-transform: uppercase;
	cursor: help;
}

.x3dom-states-head {
	display: block;
	font-size: 26px;
}

.x3dom-states-rendermode-software {
	font-size: 10px;
	margin: 0 0 2px 2px;
}

.x3dom-states-rendermode-hardware {
	font-size: 10px;
	margin: 0 0 2px 2px;
}

.x3dom-states-head2 {
	font-size: 10px;
}

.x3dom-states-list {
	float: left;
	width: 100%;
	border-top: 1px solid #C8C8C8;
	list-style: none;
	font-size: 9px;
	line-height: 16px;
	margin:0;
	padding: 0;
	padding-top: 2px;
}

.x3dom-states-item  {
	width: 100%;
	float: left;
}

.x3dom-states-item-title {
	float: left;
	margin-left: 2px;
}

.x3dom-states-item-value {
	float: right;
	margin-right: 2px;
}

.x3dom-touch-marker {
	display: inline;
	padding: 5px;
	border-radius: 10px;
	position: absolute;
	font-family: Helvetica, sans-serif;
	line-height:10px;
	font-size: 10px;
	color: darkorange;
	background: cornsilk;
	opacity: 0.6;
	border: 2px solid orange;
	z-index: 200;
}

.x3dom-log {
	position: absolute;
	bottom: 16px;
	left: 50%;
	transform: translateX(-50%);
	width: 90%;
	border: 2px solid olivedrab;
	height: 200px;
	padding: 4px;
	overflow: auto;
	white-space: pre-wrap;
	font-family: sans-serif;
	font-size: x-small;
	color: #00ff00;
	background-color: black;
	opacity: 0.8;
	-webkit-user-select: text;
	   -moz-user-select: text;
		-ms-user-select: text;
			user-select: text;
}

.x3dom-nox3d {

}

.x3dom-nox3d p { 
	color: #fff;
	font-size: 14px;
}

.x3dom-nox3d a { 
	color: #fff;
	font-size: 14px;
}

	z-index:999;
	padding-top:5px;

	top:0;

	height:100%;

	font-weight:bold;
	margin:-20px -15px 0 0;

.modalclose:hover, .modalclose:focus{
	color:#000;
	text-decoration:none;
	cursor:pointer;
}
