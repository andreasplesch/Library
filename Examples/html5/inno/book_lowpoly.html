<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>INNOVATE THE FUTURE, InnovationsoftheWorld.com</title>
    <script type='text/javascript' src='https://www.x3dom.org/download/dev/x3dom.debug.js'> </script>
    <link rel='stylesheet' type='text/css' href='https://www.x3dom.org/download/x3dom.css'/>
    <style>
        html, body {
            margin: 0px;
            padding: 0px;
            border: 0px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(rgb(128 128 128 / 50%), rgb(255 255 255 / 49%));
        }

        X3D {
            width: 100%;
            height: 100%;
        }

        .buttons {
          position: fixed;
          top: 90%;
          right: 50%;
        }

        .heading {
          position: fixed;
          right: 50%;
          opacity: 10%;
          font-family: sans-serif;
        }
    </style>
</head>
<script>

  function openbook() {
    const ts=document.querySelector('Inline').querySelector('[DEF=TIMEOpen]');
    ts.setAttribute('loop', false);
    ts.setAttribute('startTime', Date.now()/1000);
  }

  function closebook() {
    const ts=document.querySelector('Inline').querySelector('[DEF=TIMEClose]');
    ts.setAttribute('loop', false);
    ts.setAttribute('startTime', Date.now()/1000);
  }

</script>
<body>
<X3D disableKeys='true'>
  <h1 class='heading'>INNOVATE</h1>
  <div class='buttons'>
      <button onclick='openbook()'>Open</button>
      <button onclick='closebook()'>Close</button>
  </div>

  <Scene>
    <Viewpoint position="-0.48490 0.37811 -0.06659" orientation="0.00540 0.87545 0.48329 3.11444" 
	zNear="0.10000" zFar="1000.00000" centerOfRotation="-0.49630 0.04530 0.14296" fieldOfView="0.78540" description="look down"></Viewpoint>
    <Inline url='"https://ap-cors.glitch.me/https://raw.githack.com/andreasplesch/Library/4aab5cbf542f36cbf2672e5cd0b5729e7842caab/Examples/html5/inno/Game Book - One Texture Low Poly.x3d"' namespacename='book'></Inline>
  </Scene>
</X3D>
</body>
</html>
