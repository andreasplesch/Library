<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>add X3D</title>
    <script type='text/javascript' src='https://www.x3dom.org/download/dev/x3dom.debug.js'> </script>
    <link rel='stylesheet' type='text/css' href='https://www.x3dom.org/download/x3dom.css'/>
    <style>
        html, body {
            margin: 0px;
            padding: 0px;
            border: 0px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(rgb(128 128 128 / 50%), rgb(255 255 255 / 49%));
        }

        X3D {
            width: 100%;
            height: 100%;
        }

        .buttons {
          position: fixed;
          top: 90%;
          right: 50%;
        }

        .heading {
          position: fixed;
          right: 50%;
        }
    </style>
</head>
<script>

  function openbook() {
    const ts=document.querySelector('Inline').querySelector('[DEF=TIMEOpen]');
    ts.setAttribute('loop', false);
    ts.setAttribute('startTime', Date.now()/1000);
  }

  function closebook() {
    const ts=document.querySelector('Inline').querySelector('[DEF=TIMEClose]');
    ts.setAttribute('loop', false);
    ts.setAttribute('startTime', Date.now()/1000);
  }

</script>
<body>
<X3D>
  <h1 class='heading'>Inno Book</h1>
  <div class='buttons'>
      <button onclick='openbook()'>Open</button>
      <button onclick='closebook()'>Close</button>
  </div>

  <Scene>
    <Viewpoint position="-23.57889 19.62506 -8.32865" orientation="-0.01564 0.89679 0.44217 3.25287" 
	    centerOfRotation="-21.24609 1.90513 8.01645" fieldOfView="0.78540" description="look down"></Viewpoint>
    <Inline url='"Bookfromblend.x3d"' namespacename='book'></Inline>
  </Scene>
</X3D>
</body>
</html>
