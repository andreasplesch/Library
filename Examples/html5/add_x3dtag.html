<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>add X3D</title>
    <script type='text/javascript' src='https://www.x3dom.org/download/dev/x3dom.debug.js'> </script>
    <link rel='stylesheet' type='text/css' href='https://www.x3dom.org/download/x3dom.css'/>
</head>
<script>
    var x3dstr = `
    <x3d id="x3dGameRoom" class="w-100 h-100" showlog="true" width="1978px" height="1220px" style="">
    <scene id="scMain" render="true" visible="true" bboxcenter="0,0,0" bboxsize="-1,-1,-1" pickmode="idBuf" dopickpass="true">
        <pointlight id="plDmLight" location="0 5 0" ambientintensity="0.2" intensity="0.1" radius="100" color="1 1 1" on="True" shadowmapsize="1024" znear="-1" zfar="-1" attenuation="1,0,0"></pointlight>
        <navigationinfo id="vpFrontNi" headlight="false" type="EXAMINE" typeparams="-0.4,60,0.05,2.8" explorationmode="all" avatarsize="0.25,1.6,0.75" walkdamping="2" speed="1" transitiontime="1" transitiontype="LINEAR "></navigationinfo>
        <viewpoint id="vpFront" position="13.28457 9.78002 14.11521" orientation="-0.66124 0.70271 0.26261 0.95113" centerofrotation="5 0 5" fieldofview="0.78540" description="Scene View" nearclippingplane="-1" farclippingplane="-1" znear="-1" zfar="-1"></viewpoint>
        <background def="blues" groundcolor="0 1 0" skyangle="1.35 1.45 1.52 1.57" skycolor="0 0 1 0.11764 0.5747 1 0 0.74901 1 0.52941 0.80784 0.92156 1 1 1" groundangle="" backurl="" bottomurl="" fronturl="" lefturl="" righturl="" topurl=""></background>   
    </scene>
    </x3d>
    `;
    var holder = document.createElement('holder');
    holder.innerHTML = x3dstr;
    function addX3D() {
        document.querySelector('#x3dcontainer').appendChild(holder););
    }
</script>
<body>
<h1>add x3d tag</h1>
<p>
    <button onclick='addX3D()'>Test adding x3d dom triggering duplicate log messages.</button>
</p>
  <div id='x3dcontainer'></div>
 </body>
 </html>
