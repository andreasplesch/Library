<!DOCTYPE html>
<html>
<head>
<title>viewpoint test</title>
<base target="_blank">
<meta http-equiv='Content-Type' content='text/html;charset=utf-8'/>
<link rel='stylesheet' type='text/css' href='https://www.x3dom.org/x3dom/release/x3dom.css'/>
<script type='text/javascript' src='https://www.x3dom.org/x3dom/release/x3dom.js'></script>

<body><font face="sans-serif">

<table>
<tr><td valign='top' width='85%'>

<X3D id='x3d' showStat='false' showLog='false' x='0px' y='0px' width='800' height='600' style='border:1px solid black'>
<Scene DEF='scene'>
<!-- X3D generated by the NIST STEP File Analyzer and Viewer 4.53 -->

<!-- SAVED VIEW0 MBD_A -->
<Switch whichChoice='0' id='swView0'><Group>
<Transform translation='0. 0. -40.53'>
<Shape>
    <Appearance>
    <Material diffuseColor='1 0 0'></Material>
    </Appearance>
    <Sphere radius='20'></Sphere>
</Shape>
</Transform>
</Group></Switch>

<!-- SAVED VIEW1 MBD_B -->
<Switch whichChoice='0' id='swView1'><Group>
<Transform translation='0. 3.038 0.'>
<Shape>
    <Appearance>
    <Material diffuseColor='0 1 0'></Material>
    </Appearance>
    <Sphere radius='20'></Sphere>
</Shape>
</Transform>
</Group></Switch>

<!-- PART GEOMETRY -->
<Switch whichChoice='0' id='swPRT'><Group onclick='handleGroupClick(event)'>
<Transform translation='40.038 0. 0.'>
<Shape>
    <Appearance>
    <Material diffuseColor='0 0 1'></Material>
    </Appearance>
     <Box size='10 10 10'></Box>
</Shape>
</Transform>
</Group></Switch>

<!-- VIEWPOINTS -->
<Viewpoint id='All' position='0. -391.16 0.' centerOfRotation='0. 1.519 0.' orientation='1 0 0 1.5708'></Viewpoint>

<Transform translation='-568.862 497.269 359.53' rotation='-0.1317 -1. 0.3178 3.8882'>
 <Viewpoint id='MBD_A' position='0 0 0' orientation='0 1 0 3.14156'></Viewpoint>
</Transform>

<Transform translation='-396.81 406.011 330.275' rotation='-0.1317 -1. 0.3178 3.8882'>
 <Viewpoint id='MBD_B' position='0 0 0' orientation='0 1 0 3.14156'></Viewpoint>
</Transform>

<!-- BACKGROUND, NAVIGATION, WORLD INFO -->
<Background id='BG' skyColor='.8 .8 .8'/>
</Scene></X3D>
</td>

<!-- RIGHT COLUMN BUTTONS -->
<td valign='top'>

<!-- Part geometry checkbox -->
<input type='checkbox' checked onclick='togPRT(this.value)'>Part geometry (blue)

<!-- Saved view checkboxes -->
<br><input type='checkbox' checked onclick='togView0(this.value)'>MBD_A (red)
<br><input type='checkbox' checked onclick='togView1(this.value)'>MBD_B (green)
</td></tr></table>

<!-- PRT switch -->
<script>
function togPRT(choice){
 if (!document.getElementById('swPRT').checked)
    {document.getElementById('swPRT').setAttribute('whichChoice', -1);} 
 else 
    {document.getElementById('swPRT').setAttribute('whichChoice', 0);}
 document.getElementById('swPRT').checked = !document.getElementById('swPRT').checked;
}</script>
 
<!-- View0 MBD_A switch -->
<script>
function togView0(choice){
 if (!document.getElementById('swView0').checked)
    {document.getElementById('swView0').setAttribute('whichChoice', -1);}
 else
    {document.getElementById('swView0').setAttribute('whichChoice', 0);}
 document.getElementById('swView0').checked = !document.getElementById('swView0').checked;
}</script>

<!-- View1 MBD_B switch -->
<script>
function togView1(choice){
 if (!document.getElementById('swView1').checked) {document.getElementById('swView1').setAttribute('whichChoice', -1);} else {document.getElementById('swView1').setAttribute('whichChoice', 0);}
 document.getElementById('swView1').checked = !document.getElementById('swView1').checked;
}
</script>

<script>
document.onload = function() {
  var view = document.getElementById('MBD_A');
  //view.addEventListener('isActive', function() {alert('MBD_A');}, false);
  view.addEventListener('outputchange', function(event) {
      alert('MBD_A changed:' + event.fieldName + " is " + event.value );
      }, false);

}
</script>

</font></body></html>
