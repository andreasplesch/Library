<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
	<meta http-equiv="X-UA-Compatible" content="chrome=1" />
	<meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
	<title>Inline HTML Reflection</title>

	<script type="text/javascript" src="https://create3000.github.io/code/x_ite/latest/dist/x_ite.js">
	</script>

	<style>
		x3d-canvas {
			background: #414141;
			width: 500px;
			height: 500px;
			position: relative;
			/* in order to be able to position stat-div within X3D */
			float: left;
			/* float the element so it has the same size like the canvas */
			cursor: pointer;
			margin: 0;
			padding: 0;
			border: 1px solid #000;
		}

		html,
		body {
			margin: 0px;
			padding: 0px;
			border: 0px;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}
	</style>
</head>

<body>
	<h1>Inline HTML Reflection</h1>
	<p>This example shows how to use the reflection of inline into HTML</p>

	<x3d-canvas>
		<X3D>
			<Scene>
				<Viewpoint position='0 0 10' />
				<Background skyColor='0 0 0.01' />
				<Transform>
					<Inline nameSpaceName="test1" url='"scene/reflection_box1.x3d"' />
				</Transform>
			</Scene>
		</X3D>
	</x3d-canvas>

	<x3d-canvas>
		<X3D>
			<Scene>
				<Viewpoint position='0 0 10' />
				<Background skyColor='0 0.01 0' />
				<Transform>
					<Inline nameSpaceName="test3" url='"scene/reflection_box3.x3d"' />	
				</Transform>
			</Scene>
		</X3D>
	</x3d-canvas>


</body>

</html>
